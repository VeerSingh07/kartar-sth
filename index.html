<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartar Sports &amp; Toys House - Product Retail Price Checker</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            amber: {
              50: '#fffbeb',
              100: '#fef3c7',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Dexie.js (IndexedDB wrapper) -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

  <!-- STANDALONE MODULAR DATA & DATABASE SCRIPTS -->
  <script src="./js/seedData.js"></script>
  <script src="./js/db.js"></script>

  <!-- FULL SELF-CONTAINED INDEXEDDB ENGINE & HELPERS -->
  <script>
    (function() {
      if (typeof Dexie !== 'undefined' && (!window.db || typeof window.db.products === 'undefined')) {
        const db = new Dexie('KartarSportsDB');
        db.version(4).stores({
          products: '++id, catalogTag, itemNo, name, sku, category, brand, supplierId, retailPrice, wholesalePrice, currentQuantity, minStockAlert, updatedAt',
          suppliers: '++id, name, phone, address',
          settings: 'key, value',
          revisions: '++id, revId, timestamp, note, totalProducts, totalWholesaleCost, totalRetailVal, snapshotData'
        });
        window.db = db;
      }

      if (!window.formatINR) {
        window.formatINR = function(amount) {
          if (amount === null || amount === undefined || isNaN(amount)) return '₹0';
          const num = Math.round(amount * 100) / 100;
          return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(num);
        };
      }

      if (!window.calculatePrices) {
        window.calculatePrices = function(wholesalePrice, additionalCost, pricingMethod, markupPercent, marginPercent, manualRetailPrice, roundingMethod) {
          const wholesale = parseFloat(wholesalePrice) || 0;
          const extraCost = parseFloat(additionalCost) || 0;
          const totalCost = wholesale + extraCost;
          let calculatedPrice = totalCost;
          const percent = parseFloat(marginPercent) || 0;
          calculatedPrice = percent >= 100 ? totalCost * 2 : totalCost / (1 - percent / 100);
          let suggestedRetailPrice = Math.round(calculatedPrice / 5) * 5;
          const finalRetailPrice = pricingMethod === 'manual' ? Math.max(0, parseFloat(manualRetailPrice) || 0) : suggestedRetailPrice;
          const profit = finalRetailPrice - totalCost;
          return {
            wholesale, extraCost, totalCost, calculatedPrice: Math.round(calculatedPrice * 100) / 100,
            suggestedRetailPrice, finalRetailPrice, profit: Math.round(profit * 100) / 100,
            actualMarginPercent: finalRetailPrice > 0 ? Math.round(((profit / finalRetailPrice) * 100) * 100) / 100 : 0,
            actualMarkupPercent: totalCost > 0 ? Math.round(((profit / totalCost) * 100) * 100) / 100 : 0
          };
        };
      }

      if (!window.syncToPhysicalFile) {
        window.syncToPhysicalFile = async function() {
          try {
            if (!window.db) return;
            const products = await window.db.products.toArray();
            const suppliers = await window.db.suppliers.toArray();
            const rawRevisions = await window.db.revisions.toArray();
            const revisionIndex = rawRevisions.map(r => ({ revId: r.revId, timestamp: r.timestamp, note: r.note, totalProducts: r.totalProducts, totalWholesaleCost: r.totalWholesaleCost, totalRetailVal: r.totalRetailVal }));
            const dbPayload = { version: 'KartarSportsDB_v4', updatedAt: new Date().toISOString(), products, suppliers, revisions: revisionIndex };
            const jsonStr = JSON.stringify(dbPayload, null, 2);
            localStorage.setItem('kartar_master_db_backup', jsonStr);
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            if (isLocal) {
              try { await fetch('http://localhost:3001/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: jsonStr }); } catch (e) {}
            }
          } catch (e) {}
        };
      }

      if (!window.importPhysicalData) {
        window.importPhysicalData = async function(data) {
          if (!data || !data.products || !Array.isArray(data.products) || !window.db) return;
          await window.db.products.clear();
          await window.db.suppliers.clear();
          for (const p of data.products) { const { id, ...rest } = p; await window.db.products.add(rest); }
          if (data.suppliers && Array.isArray(data.suppliers)) { for (const s of data.suppliers) { const { id, ...rest } = s; await window.db.suppliers.add(rest); } }
          if (data.revisions && Array.isArray(data.revisions)) {
            for (const r of data.revisions) {
              const existing = await window.db.revisions.where('revId').equals(r.revId).first();
              if (!existing) { const { id, ...rest } = r; await window.db.revisions.add(rest); }
            }
          }
          await window.db.settings.put({ key: 'db_seeded_v4', value: 'true' });
        };
      }

      if (!window.initDatabaseIfNeeded) {
        window.initDatabaseIfNeeded = async function() {
          if (!window.db) return;
          let existingCount = await window.db.products.count();
          let physicalData = null;
          const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

          if (isLocal) {
            try { const res = await fetch('http://localhost:3001/api/db'); if (res.ok) physicalData = await res.json(); } catch (err) {}
          }

          if (!physicalData) {
            if (window.PHYSICAL_DATABASE_FILE && window.PHYSICAL_DATABASE_FILE.products) {
              physicalData = window.PHYSICAL_DATABASE_FILE;
            } else {
              try { const res = await fetch('data/database_file.json'); if (res.ok) physicalData = await res.json(); } catch (e) {}
            }
          }

          if (physicalData && physicalData.products && Array.isArray(physicalData.products)) {
            if (existingCount === 0 || existingCount !== physicalData.products.length) {
              await window.importPhysicalData(physicalData);
              return;
            }
          }

          if (existingCount > 0) return;
          let localBackup = localStorage.getItem('kartar_master_db_backup');
          if (localBackup) { try { await window.importPhysicalData(JSON.parse(localBackup)); } catch (e) {} }
        };
      }
    })();
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #printable-area, #printable-area * {
        visibility: visible;
      }
      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-900 antialiased min-h-screen selection:bg-emerald-600 selection:text-white">
  <div id="root"></div>

  <!-- Main Embedded Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- MAIN INDEX PRICE CHECKER APPLICATION ---
    function App() {
      const [products, setProducts] = useState([]);
      const [selectedCatalog, setSelectedCatalog] = useState('ALL');
      const [loading, setLoading] = useState(true);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [priceTagModalOpen, setPriceTagModalOpen] = useState(false);
      const [isFileConnected, setIsFileConnected] = useState(false);

      const refreshData = async () => {
        try {
          setLoading(true);
          await window.initDatabaseIfNeeded();
          let prodList = await db.products.toArray();
          setProducts(prodList);
        } catch (err) {
          console.error('Failed to load database:', err);
        } finally {
          setLoading(false);
        }
      };

      const handleConnectDiskFile = async () => {
        const connected = await window.connectPhysicalFile();
        if (connected) {
          setIsFileConnected(true);
          await refreshData();
        }
      };

      useEffect(() => {
        refreshData();
      }, []);

      return (
        <div className="min-h-screen bg-slate-100/70 text-slate-900 font-sans antialiased selection:bg-emerald-600 selection:text-white p-4 md:p-8">
          
          <PriceCheckerPage
            products={products}
            selectedCatalog={selectedCatalog}
            setSelectedCatalog={setSelectedCatalog}
            setSelectedProduct={setSelectedProduct}
            setPriceTagModalOpen={setPriceTagModalOpen}
            isFileConnected={isFileConnected}
            handleConnectDiskFile={handleConnectDiskFile}
          />

          {priceTagModalOpen && selectedProduct && (
            <PriceTagModal
              product={selectedProduct}
              settings={window.DEFAULT_APP_SETTINGS}
              onClose={() => setPriceTagModalOpen(false)}
            />
          )}

          {/* FOOTER */}
          <footer className="mt-12 text-center text-xs font-bold text-slate-500 py-6 border-t-2 border-slate-200">
            <p>Kartar Sports &amp; Toys House • Retail Price Lookup Counter Tool</p>
            <p className="mt-1">
              Need admin access? <a href="admin.html" className="text-emerald-700 hover:underline font-black">Open Admin Management Portal →</a>
            </p>
          </footer>
        </div>
      );
    }

    // --- RETAIL PRICE CHECKER PAGE ---
    function PriceCheckerPage({
      products, selectedCatalog, setSelectedCatalog, setSelectedProduct, setPriceTagModalOpen,
      isFileConnected, handleConnectDiskFile
    }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [viewMode, setViewMode] = useState('list');
      const searchInputRef = useRef(null);

      useEffect(() => {
        if (searchInputRef.current) {
          searchInputRef.current.focus();
        }
      }, []);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCatalog = selectedCatalog === 'ALL' || p.catalogTag === selectedCatalog;
          const matchSearch = searchTerm === '' ||
            p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            p.sku.toLowerCase().includes(searchTerm.toLowerCase()) ||
            String(p.itemNo) === searchTerm.trim();
          return matchCatalog && matchSearch;
        }).sort((a, b) => (a.itemNo || 0) - (b.itemNo || 0));
      }, [products, selectedCatalog, searchTerm]);

      return (
        <div className="space-y-6 max-w-6xl mx-auto">

          {/* HEADER BANNER */}
          <div className="bg-gradient-to-r from-emerald-600 to-emerald-800 text-white rounded-3xl p-6 md:p-8 shadow-xl">
            <div className="flex items-center gap-2 mb-2">
              <span className="px-3 py-1 bg-white/20 text-white rounded-full text-xs font-black uppercase tracking-wider">
                🏷️ Storefront Counter Mode
              </span>
              <span className="text-xs text-emerald-200 font-bold">• Kartar Sports &amp; Toys</span>
            </div>
            <h2 className="text-3xl md:text-4xl font-black tracking-tight">Product Retail Price Checker</h2>
            <p className="text-sm font-extrabold text-emerald-100 mt-1">Instant MRP lookup by Product S.N. (#1, #127), SKU (BIG1, SML127), or Name</p>
          </div>

          {/* CATALOG FILTER TABS & VIEW TOGGLE SWITCHER */}
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => setSelectedCatalog('ALL')}
                className={`py-3 px-5 rounded-2xl font-extrabold text-sm border-2 transition-all flex items-center gap-2.5 ${selectedCatalog === 'ALL'
                  ? 'bg-slate-950 text-white border-slate-950 shadow-md ring-2 ring-slate-950/30'
                  : 'bg-white text-slate-800 border-slate-300 hover:bg-slate-50'
                  }`}
              >
                <span>📦 All Catalogs</span>
                <span className={`px-2.5 py-0.5 rounded-full text-xs font-black ${selectedCatalog === 'ALL' ? 'bg-slate-800 text-white' : 'bg-slate-200 text-slate-900'}`}>{products.length}</span>
              </button>

              <button
                onClick={() => setSelectedCatalog('Big Toys')}
                className={`py-3 px-5 rounded-2xl font-extrabold text-sm border-2 transition-all flex items-center gap-2.5 ${selectedCatalog === 'Big Toys'
                  ? 'bg-emerald-600 text-white border-emerald-600 shadow-md ring-2 ring-emerald-600/30'
                  : 'bg-white text-slate-800 border-slate-300 hover:bg-slate-50'
                  }`}
              >
                <span>🧸 Big Toys Catalog</span>
              </button>

              <button
                onClick={() => setSelectedCatalog('Small Toys')}
                className={`py-3 px-5 rounded-2xl font-extrabold text-sm border-2 transition-all flex items-center gap-2.5 ${selectedCatalog === 'Small Toys'
                  ? 'bg-emerald-600 text-white border-emerald-600 shadow-md ring-2 ring-emerald-600/30'
                  : 'bg-white text-slate-800 border-slate-300 hover:bg-slate-50'
                  }`}
              >
                <span>🪀 Small Toys Catalog</span>
              </button>
            </div>

            <div className="flex items-center gap-3">
              {/* VIEW MODE TOGGLE SWITCHER */}
              <div className="flex items-center bg-white p-1 rounded-2xl border-2 border-slate-300 shadow-xs">
                <button
                  onClick={() => setViewMode('list')}
                  className={`py-2 px-3.5 rounded-xl font-black text-xs flex items-center gap-1.5 transition-all ${viewMode === 'list' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-700 hover:text-slate-950'
                    }`}
                >
                  <span>📋 List View</span>
                </button>

                <button
                  onClick={() => setViewMode('grid')}
                  className={`py-2 px-3.5 rounded-xl font-black text-xs flex items-center gap-1.5 transition-all ${viewMode === 'grid' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-700 hover:text-slate-950'
                    }`}
                >
                  <span>📱 Grid View</span>
                </button>
              </div>

              <div className="text-xs font-black text-slate-600 px-2 font-mono hidden md:block">
                Showing {filteredProducts.length} Products
              </div>
            </div>
          </div>

          {/* GIANT SEARCH BAR WITH CLEAR BUTTON NEXT TO IT */}
          <div className="flex flex-col sm:flex-row items-stretch gap-3">
            <div className="relative flex-1 shadow-xl rounded-3xl">
              <span className="absolute inset-y-0 left-5 flex items-center text-emerald-600 text-2xl pointer-events-none">🔍</span>
              <input
                ref={searchInputRef}
                type="text"
                placeholder="Type Product S.N. (#1, #20, #127), SKU (BIG1, SML127), or Item Name..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full pl-14 pr-12 py-5 bg-white border-4 border-emerald-500 rounded-3xl text-lg md:text-xl font-black text-slate-950 shadow-inner focus:outline-none focus:ring-4 focus:ring-emerald-200 transition-all"
              />
              {searchTerm && (
                <button
                  onClick={() => setSearchTerm('')}
                  className="absolute inset-y-0 right-4 flex items-center text-slate-400 hover:text-slate-800 text-xl font-black"
                  title="Clear text"
                >
                  ✕
                </button>
              )}
            </div>
            <button
              onClick={() => setSearchTerm('')}
              disabled={!searchTerm}
              className={`py-5 px-6 font-black rounded-3xl text-base transition-all shadow-lg flex items-center justify-center gap-2 whitespace-nowrap border-2 ${searchTerm
                ? 'bg-rose-600 hover:bg-rose-700 text-white border-rose-500 cursor-pointer active:scale-95'
                : 'bg-slate-200 text-slate-400 border-slate-300 cursor-not-allowed'
                }`}
            >
              🧹 Clear Search
            </button>
          </div>

          {/* RETAIL PRODUCTS DISPLAY: LIST VIEW OR GRID VIEW */}
          {viewMode === 'list' ? (
            <div className="bg-white border-2 border-slate-200 rounded-3xl overflow-hidden shadow-sm">
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-950 text-white text-xs font-black uppercase tracking-wider">
                      <th className="py-4 px-4 text-center">S.N.</th>
                      <th className="py-4 px-4">Catalog Tag</th>
                      <th className="py-4 px-4">Product Name</th>
                      <th className="py-4 px-4">SKU Code</th>
                      <th className="py-4 px-6 text-right">Retail MRP Price</th>
                      <th className="py-4 px-5 text-center">Price Tag</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y-2 divide-slate-100 text-sm font-sans">
                    {filteredProducts.map(p => (
                      <tr
                        key={p.id}
                        className="hover:bg-emerald-50/60 transition-all cursor-pointer"
                        onClick={() => { setSelectedProduct(p); setPriceTagModalOpen(true); }}
                      >
                        <td className="py-4 px-4 font-mono font-black text-center text-slate-950 text-base">
                          #{p.itemNo}
                        </td>
                        <td className="py-4 px-4">
                          <span className={`px-3 py-1 rounded-full text-xs font-extrabold border ${p.catalogTag === 'Big Toys' ? 'bg-amber-100 text-amber-950 border-amber-300' : 'bg-sky-100 text-sky-950 border-sky-300'
                            }`}>
                            {p.catalogTag}
                          </span>
                        </td>
                        <td className="py-4 px-4 font-black text-slate-950 text-base md:text-lg">
                          {p.name}
                          {p.currentQuantity === 0 && (
                            <span className="ml-2 px-2 py-0.5 bg-rose-100 text-rose-800 border border-rose-300 rounded text-[10px] font-black uppercase">OUT OF STOCK</span>
                          )}
                        </td>
                        <td className="py-4 px-4 font-mono text-xs font-bold text-slate-600">
                          {p.sku}
                        </td>
                        <td className="py-4 px-6 text-right font-mono font-black text-emerald-700 text-xl md:text-2xl">
                          {formatINR(p.retailPrice)}
                        </td>
                        <td className="py-4 px-5 text-center">
                          <button
                            onClick={(e) => { e.stopPropagation(); setSelectedProduct(p); setPriceTagModalOpen(true); }}
                            className="py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold shadow-md transition"
                          >
                            🏷️ Price Tag
                          </button>
                        </td>
                      </tr>
                    ))}
                    {filteredProducts.length === 0 && (
                      <tr>
                        <td colSpan="6" className="py-12 text-center text-slate-500 font-extrabold text-base">
                          No items match "{searchTerm}" in {selectedCatalog} Catalog
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          ) : (
            /* RETAIL PRODUCTS GRID LOOKUP */
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              {filteredProducts.map(p => (
                <div
                  key={p.id}
                  onClick={() => { setSelectedProduct(p); setPriceTagModalOpen(true); }}
                  className="bg-white border-2 border-slate-200 hover:border-emerald-500 rounded-3xl p-6 shadow-sm hover:shadow-xl transition-all cursor-pointer flex flex-col justify-between group"
                >
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <span className="px-3 py-1 bg-slate-900 text-white rounded-xl text-xs font-mono font-black shadow-xs">
                        S.N. #{p.itemNo}
                      </span>
                      <span className={`px-3 py-1 rounded-full text-xs font-black border ${p.catalogTag === 'Big Toys' ? 'bg-amber-100 text-amber-950 border-amber-300' : 'bg-sky-100 text-sky-950 border-sky-300'
                        }`}>
                        {p.catalogTag}
                      </span>
                    </div>

                    <h3 className="font-extrabold text-lg md:text-xl text-slate-950 group-hover:text-emerald-700 transition leading-snug">
                      {p.name}
                    </h3>

                    <div className="mt-2 text-xs font-mono font-bold text-slate-500">
                      SKU: <span className="text-slate-800 font-extrabold">{p.sku}</span>
                    </div>
                  </div>

                  <div className="mt-6 pt-4 border-t-2 border-slate-100 flex items-end justify-between">
                    <div>
                      <span className="text-[10px] font-black uppercase text-slate-500 tracking-wider block">Retail Selling Price</span>
                      <span className="text-3xl font-black text-emerald-700 font-mono tracking-tight">{formatINR(p.retailPrice)}</span>
                    </div>

                    <button className="py-2 px-3 bg-emerald-50 group-hover:bg-emerald-600 text-emerald-800 group-hover:text-white rounded-xl text-xs font-extrabold transition">
                      Tag 🏷️
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

        </div>
      );
    }

    // --- PRICE TAG MODAL ---
    function PriceTagModal({ product, settings, onClose }) {
      return (
        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 space-y-5 shadow-2xl border-2 border-slate-200 text-center">
            <div className="flex justify-end">
              <button onClick={onClose} className="text-slate-400 hover:text-slate-950 font-black">✕</button>
            </div>

            <div id="printable-area" className="p-6 border-4 border-slate-950 rounded-2xl bg-white space-y-3">
              <p className="text-[10px] font-black tracking-widest text-emerald-700 uppercase">{settings.shopName || 'KARTAR SPORTS AND TOYS HOUSE'}</p>
              <h3 className="font-extrabold text-xl text-slate-950">{product.name}</h3>
              <p className="text-xs font-extrabold text-slate-700 bg-slate-100 inline-block px-3 py-1 rounded-full">{product.catalogTag} • #{product.itemNo}</p>
              <div className="py-3 border-y-4 border-slate-950 bg-emerald-50 rounded-xl">
                <p className="text-[10px] uppercase font-black text-slate-700">Retail MRP</p>
                <p className="text-3xl font-black text-slate-950 mt-1">{formatINR(product.retailPrice)}</p>
              </div>
            </div>

            <button onClick={() => window.print()} className="w-full py-3.5 bg-slate-950 text-white font-black text-xs rounded-2xl shadow-md">🖨️ Print Customer Price Tag</button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
