    // --- UTILITY FUNCTIONS ---
    function formatINR(amount) {
      if (amount === null || amount === undefined || isNaN(amount)) return '₹0';
      const num = Math.round(amount * 100) / 100;
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 2
      }).format(num);
    }

    function calculatePrices(wholesalePrice, additionalCost, pricingMethod, markupPercent, marginPercent, manualRetailPrice, roundingMethod) {
      const wholesale = parseFloat(wholesalePrice) || 0;
      const extraCost = parseFloat(additionalCost) || 0;
      const totalCost = wholesale + extraCost;

      let calculatedPrice = totalCost;

      if (pricingMethod === 'markup') {
        const percent = parseFloat(markupPercent) || 0;
        calculatedPrice = totalCost * (1 + percent / 100);
      } else if (pricingMethod === 'margin') {
        const percent = parseFloat(marginPercent) || 0;
        if (percent >= 100) {
          calculatedPrice = totalCost * 2;
        } else {
          calculatedPrice = totalCost / (1 - percent / 100);
        }
      }

      let suggestedRetailPrice = calculatedPrice;

      if (roundingMethod === 'nearest5') {
        suggestedRetailPrice = Math.round(calculatedPrice / 5) * 5;
      } else if (roundingMethod === 'nearest10') {
        suggestedRetailPrice = Math.round(calculatedPrice / 10) * 10;
      } else if (roundingMethod === 'ending9') {
        suggestedRetailPrice = Math.floor(calculatedPrice / 10) * 10 + 9;
      } else if (roundingMethod === 'exact') {
        suggestedRetailPrice = Math.round(calculatedPrice * 100) / 100;
      }

      const finalRetailPrice = pricingMethod === 'manual'
        ? Math.max(0, parseFloat(manualRetailPrice) || 0)
        : suggestedRetailPrice;

      const profit = finalRetailPrice - totalCost;
      const actualMarginPercent = finalRetailPrice > 0 ? (profit / finalRetailPrice) * 100 : 0;
      const actualMarkupPercent = totalCost > 0 ? (profit / totalCost) * 100 : 0;

      return {
        wholesale,
        extraCost,
        totalCost,
        calculatedPrice: Math.round(calculatedPrice * 100) / 100,
        suggestedRetailPrice,
        finalRetailPrice,
        profit: Math.round(profit * 100) / 100,
        actualMarginPercent: Math.round(actualMarginPercent * 100) / 100,
        actualMarkupPercent: Math.round(actualMarkupPercent * 100) / 100
      };
    }

    // --- HIGH-READABILITY PRODUCTS PAGE ---
    function ProductsPage({
      products, suppliers, selectedCatalog, setSelectedCatalog, setCurrentPage,
      setEditingProductId, setSelectedProduct, setDetailModalOpen, setStockModalOpen,
      setPriceTagModalOpen, handleStockAdjust, handleDeleteProduct, handleDuplicateProduct
    }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [sortBy, setSortBy] = useState('itemNo');

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCatalog = selectedCatalog === 'ALL' || p.catalogTag === selectedCatalog;
          const matchSearch = searchTerm === '' ||
            p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            p.sku.toLowerCase().includes(searchTerm.toLowerCase()) ||
            String(p.itemNo) === searchTerm.trim() ||
            p.category.toLowerCase().includes(searchTerm.toLowerCase());
          return matchCatalog && matchSearch;
        }).sort((a, b) => {
          if (sortBy === 'itemNo') return (a.itemNo || 0) - (b.itemNo || 0);
          if (sortBy === 'name') return a.name.localeCompare(b.name);
          if (sortBy === 'price_high') return b.retailPrice - a.retailPrice;
          return 0;
        });
      }, [products, selectedCatalog, searchTerm, sortBy]);

      return (
        <div className="space-y-6">

          <div>
            <h2 className="text-2xl md:text-3xl font-black text-slate-950 tracking-tight">Products Catalog (Admin Mode)</h2>
            <p className="text-xs md:text-sm font-bold text-slate-600">Managing real wholesale items with calculated retail MRPs</p>
          </div>

          {/* CATALOG FILTER TABS DIRECTLY ABOVE PRODUCT TABLE */}
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => setSelectedCatalog('ALL')}
                className={`py-2.5 px-4 rounded-2xl font-extrabold text-xs md:text-sm border-2 transition-all flex items-center gap-2 ${selectedCatalog === 'ALL'
                  ? 'bg-slate-950 text-white border-slate-950 shadow-md ring-2 ring-slate-950/30'
                  : 'bg-slate-50 text-slate-800 border-slate-300 hover:bg-slate-100'
                  }`}
              >
                <span>📦 All Catalogs</span>
                <span className={`px-2 py-0.5 rounded-full text-xs font-black ${selectedCatalog === 'ALL' ? 'bg-slate-800 text-white' : 'bg-slate-200 text-slate-900'}`}>168</span>
              </button>

              <button
                onClick={() => setSelectedCatalog('Big Toys')}
                className={`py-2.5 px-4 rounded-2xl font-extrabold text-xs md:text-sm border-2 transition-all flex items-center gap-2 ${selectedCatalog === 'Big Toys'
                  ? 'bg-emerald-600 text-white border-emerald-600 shadow-md ring-2 ring-emerald-600/30'
                  : 'bg-slate-50 text-slate-800 border-slate-300 hover:bg-slate-100'
                  }`}
              >
                <span>🧸 Big Toys Catalog</span>
                <span className={`px-2 py-0.5 rounded-full text-xs font-black ${selectedCatalog === 'Big Toys' ? 'bg-emerald-800 text-white' : 'bg-slate-200 text-slate-900'}`}>37</span>
              </button>

              <button
                onClick={() => setSelectedCatalog('Small Toys')}
                className={`py-2.5 px-4 rounded-2xl font-extrabold text-xs md:text-sm border-2 transition-all flex items-center gap-2 ${selectedCatalog === 'Small Toys'
                  ? 'bg-emerald-600 text-white border-emerald-600 shadow-md ring-2 ring-emerald-600/30'
                  : 'bg-slate-50 text-slate-800 border-slate-300 hover:bg-slate-100'
                  }`}
              >
                <span>🪀 Small Toys Catalog</span>
                <span className={`px-2 py-0.5 rounded-full text-xs font-black ${selectedCatalog === 'Small Toys' ? 'bg-emerald-800 text-white' : 'bg-slate-200 text-slate-900'}`}>131</span>
              </button>
            </div>
          </div>

          {/* SEARCH BAR */}
          <div className="relative">
            <span className="absolute inset-y-0 left-4 flex items-center text-slate-500 text-xl pointer-events-none">🔍</span>
            <input
              type="text"
              placeholder="Search by S.N. (#1, #127), Product Name, SKU Code (BIG1, SML127), Category..."
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
              className="w-full pl-12 pr-4 py-4 bg-white border-2 border-slate-300 rounded-2xl text-sm font-extrabold text-slate-950 shadow-sm focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100 transition-all"
            />
          </div>

          {/* HIGH-READABILITY TABLE */}
          <div className="bg-white border-2 border-slate-200 rounded-3xl overflow-hidden shadow-sm">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-950 text-white text-xs font-black uppercase tracking-wider">
                    <th className="py-4 px-4">S.N.</th>
                    <th className="py-4 px-4">Catalog</th>
                    <th className="py-4 px-4">Item Name</th>
                    <th className="py-4 px-4">SKU Code</th>
                    <th className="py-4 px-4">Wholesale Rate</th>
                    <th className="py-4 px-4">Retail Price (MRP)</th>
                    <th className="py-4 px-4 text-center">Stock</th>
                    <th className="py-4 px-5 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y-2 divide-slate-100 text-sm font-sans">
                  {filteredProducts.map(p => (
                    <tr key={p.id} className="hover:bg-slate-50 transition-all">
                      <td className="py-4 px-4 font-mono font-black text-slate-700">#{p.itemNo}</td>
                      <td className="py-4 px-4">
                        <span className={`px-3 py-1 rounded-full text-xs font-extrabold border ${p.catalogTag === 'Big Toys' ? 'bg-amber-100 text-amber-950 border-amber-300' : 'bg-sky-100 text-sky-950 border-sky-300'
                          }`}>
                          {p.catalogTag}
                        </span>
                      </td>
                      <td className="py-4 px-4 font-black text-slate-950">{p.name}</td>
                      <td className="py-4 px-4 font-mono text-xs font-bold text-slate-700">{p.sku}</td>
                      <td className="py-4 px-4 font-mono font-bold text-slate-700">₹{p.wholesalePrice}</td>
                      <td className="py-4 px-4 font-mono font-black text-emerald-700 text-base">₹{p.retailPrice}</td>
                      <td className="py-4 px-4 text-center font-mono font-bold">{p.currentQuantity}</td>
                      <td className="py-4 px-5 text-right space-x-2">
                        <button

                        >
                          ✏️ Edit
                        </button>
                        <button
                          onClick={() => handleDeleteProduct(p.id)}
                          className="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-extrabold rounded-xl text-xs transition"

                        </button>
                      </td>
                    </tr>
                  ))}

              </table>
            </div>
          </div>

        </div>

    }

    // --- ADD / EDIT PRODUCT PAGE ---
    function AddEditProductPage({ editingProductId, products, suppliers, settings, refreshData, setCurrentPage, showToast }) {
      const existingProduct = products.find(p => p.id === editingProductId);

      const [name, setName] = useState(existingProduct?.name || '');
      const [itemNo, setItemNo] = useState(existingProduct?.itemNo || products.length + 1);
      const [sku, setSku] = useState(existingProduct?.sku || `PROD${products.length + 1}`);
      const [catalogTag, setCatalogTag] = useState(existingProduct?.catalogTag || 'Big Toys');
      const [category, setCategory] = useState(existingProduct?.category || 'Big Toys');
      const [brand, setBrand] = useState(existingProduct?.brand || 'Generic');
      const [wholesalePrice, setWholesalePrice] = useState(existingProduct?.wholesalePrice || 100);
      const [additionalCost, setAdditionalCost] = useState(existingProduct?.additionalCost || 0);
      const [pricingMethod, setPricingMethod] = useState(existingProduct?.pricingMethod || 'margin');
      const [markupPercent, setMarkupPercent] = useState(existingProduct?.markupPercent || 25);
      const [marginPercent, setMarginPercent] = useState(existingProduct?.marginPercent || 25);
      const [manualPrice, setManualPrice] = useState(existingProduct?.retailPrice || 0);
      const [roundingMethod, setRoundingMethod] = useState(existingProduct?.roundingMethod || 'nearest5');
      const [quantityPurchased, setQuantityPurchased] = useState(existingProduct?.quantityPurchased || 1);
      const [currentQuantity, setCurrentQuantity] = useState(existingProduct?.currentQuantity || 1);
      const [supplierId, setSupplierId] = useState(existingProduct?.supplierId || (suppliers[0]?.id || 1));

      const priceCalc = calculatePrices(wholesalePrice, additionalCost, pricingMethod, markupPercent, marginPercent, manualPrice, roundingMethod);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!name.trim()) return showToast('Please enter product name', 'error');

        const productData = {
          name: name.trim(),
          itemNo: parseInt(itemNo) || 1,
          sku: sku.trim(),
          catalogTag,
          category,
          brand: brand.trim() || 'Generic',
          wholesalePrice: parseFloat(wholesalePrice) || 0,
          additionalCost: parseFloat(additionalCost) || 0,
          pricingMethod,
          markupPercent: parseFloat(markupPercent) || 0,
          marginPercent: parseFloat(marginPercent) || 0,
          retailPrice: priceCalc.finalRetailPrice,
          roundingMethod,
          quantityPurchased: parseInt(quantityPurchased) || 0,
          currentQuantity: parseInt(currentQuantity) || 0,
          minStockAlert: 1,
          supplierId: parseInt(supplierId) || 1,
          updatedAt: new Date().toISOString()
        };

        try {
          if (editingProductId) {
            await db.products.update(editingProductId, productData);
            showToast('Product updated successfully!');
          } else {
            productData.createdAt = new Date().toISOString();
            await db.products.add(productData);
            showToast('Product added successfully!');
          }
          await refreshData();
          setCurrentPage('products');
        } catch (err) {
          console.error(err);
          showToast('Failed to save product', 'error');
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="flex items-center justify-between">
            <h2 className="text-2xl md:text-3xl font-black text-slate-950">{editingProductId ? 'Edit Product' : 'Add New Product'}</h2>
            <button onClick={() => setCurrentPage('products')} className="py-2.5 px-4 bg-slate-200 hover:bg-slate-300 font-extrabold text-xs rounded-2xl">Cancel</button>
          </div>

          <form onSubmit={handleSubmit} className="bg-white border-2 border-slate-200 rounded-3xl p-6 md:p-8 space-y-6 shadow-sm">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-xs font-black uppercase text-slate-600 mb-1">Product Name *</label>
                <input type="text" value={name} onChange={e => setName(e.target.value)} required className="w-full p-3.5 bg-slate-50 border-2 border-slate-300 rounded-2xl text-sm font-bold" />
              </div>
              <div>
                <label className="block text-xs font-black uppercase text-slate-600 mb-1">Catalog Tag</label>
                <select value={catalogTag} onChange={e => setCatalogTag(e.target.value)} className="w-full p-3.5 bg-slate-50 border-2 border-slate-300 rounded-2xl text-sm font-bold">
                  <option value="Big Toys">Big Toys Catalog</option>
                  <option value="Small Toys">Small Toys Catalog</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-black uppercase text-slate-600 mb-1">SKU Code</label>
                <input type="text" value={sku} onChange={e => setSku(e.target.value)} className="w-full p-3.5 bg-slate-50 border-2 border-slate-300 rounded-2xl text-sm font-mono font-bold" />
              </div>
              <div>
                <label className="block text-xs font-black uppercase text-slate-600 mb-1">Wholesale Price (₹) *</label>
                <input type="number" value={wholesalePrice} onChange={e => setWholesalePrice(e.target.value)} required className="w-full p-3.5 bg-slate-50 border-2 border-slate-300 rounded-2xl text-sm font-mono font-bold" />
              </div>
            </div>

            <div className="p-5 bg-emerald-50 border-2 border-emerald-200 rounded-2xl flex items-center justify-between">
              <div>
                <p className="text-xs font-black uppercase text-emerald-800">Calculated Retail Price (MRP)</p>
                <p className="text-3xl font-black text-emerald-950 mt-1">₹{priceCalc.finalRetailPrice}</p>
              </div>
              <button type="submit" className="py-4 px-8 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm rounded-2xl shadow-lg">Save Product</button>
            </div>
          </form>
        </div>
      );
    }

    // --- BULK PRICE MANAGER PAGE ---
    function PriceManagerPage({ products, suppliers, refreshData, showToast }) {
      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl md:text-3xl font-black text-slate-950">Bulk Price Calculator</h2>
            <p className="text-xs md:text-sm font-bold text-slate-600">Overview of calculated retail margins across all inventory items</p>

          <div className="bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-sm">
            <p className="text-sm font-extrabold text-slate-700">Total catalog items under pricing review: {products.length}</p>
          </div>
        </div>
      );
    }

    function SuppliersPage({ suppliers, products, refreshData, showToast }) {
      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl md:text-3xl font-black text-slate-950">Suppliers Directory</h2>
            <p className="text-xs md:text-sm font-bold text-slate-600">Wholesale suppliers and challan details</p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">

    // --- REPORTS PAGE ---
    function ReportsPage({ products, metrics, settings }) {
      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl md:text-3xl font-black text-slate-950">Reports &amp; Export</h2>
            <p className="text-xs md:text-sm font-bold text-slate-600">Export product price lists to Excel</p>

          <div className="bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">

            <p className="text-sm font-bold text-slate-700">Total Products: {metrics.totalProducts}</p>

    // --- PRINT PRICE LIST PAGE ---

        <div className="space-y-6">
          <div className="no-print flex items-center justify-between bg-white border-2 border-slate-200 rounded-3xl p-6">
            <div>
              <h2 className="text-2xl font-black text-slate-950">Print Wholesale Price Sheet</h2>
              <p className="text-xs font-bold text-slate-600">Ready to print for internal catalog records</p>
            </div>
            <button onClick={() => window.print()} className="py-3.5 px-6 bg-slate-950 text-white font-black text-xs rounded-2xl shadow-md">🖨️ Print Price Sheet</button>
          </div>

          <div id="printable-area" className="bg-white p-8 border-2 border-slate-200 rounded-3xl space-y-6">
            <div className="text-center border-b-2 border-slate-950 pb-4">
              <h1 className="text-2xl font-black">{settings.shopName || 'KARTAR SPORTS AND TOYS HOUSE'}</h1>
              <p className="text-xs font-bold text-slate-600">Product Wholesale &amp; Retail MRP Price Sheet</p>

            <table className="w-full text-left text-xs border-collapse">

                <tr className="border-b-2 border-slate-950 font-black">

              <tbody className="divide-y divide-slate-200">
                {products.map(p => (
                  <tr key={p.id} className="py-1">
                    <td className="py-2 font-mono">#{p.itemNo}</td>

              </tbody>

          </div>

    }

    // --- SETTINGS PAGE ---
    function SettingsPage({ settings, db, refreshData, showToast, seedAllRealCatalogs }) {
      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h2 className="text-2xl md:text-3xl font-black text-slate-950">Settings &amp; Data Management</h2>
            <p className="text-xs md:text-sm font-bold text-slate-600">System configuration and data reset options</p>

          <div className="bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
            <h3 className="font-extrabold text-lg text-slate-950">Catalog Database Options</h3>
            <p className="text-xs font-bold text-slate-600">Re-seed all 37 Big Toys and 131 Small Toys catalog items from wholesale estimate records.</p>

    // --- PRODUCT DETAIL MODAL ---
    function ProductDetailModal({ product, supplier, onClose, onEdit }) {

              <button onClick={onClose} className="text-slate-400 hover:text-slate-950 font-black">✕</button>

    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
