<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartar Sports &amp; Toys House - Admin Portal</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            amber: {
              50: '#fffbeb',
              100: '#fef3c7',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Dexie.js (IndexedDB wrapper) -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

  <!-- SheetJS / XLSX for Excel export -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <!-- STANDALONE MODULAR DATA & DATABASE SCRIPTS -->
  <script src="./js/seedData.js"></script>
  <script src="./js/db.js"></script>

  <!-- EMERGENCY GLOBAL FALLBACK HELPERS -->
  <script>
    if (!window.formatINR) {
      window.formatINR = function(amount) {
        if (amount === null || amount === undefined || isNaN(amount)) return '₹0';
        const num = Math.round(amount * 100) / 100;
        return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(num);
      };
    }
    if (!window.calculatePrices) {
      window.calculatePrices = function(wholesalePrice, additionalCost, pricingMethod, markupPercent, marginPercent, manualRetailPrice, roundingMethod) {
        const wholesale = parseFloat(wholesalePrice) || 0;
        const extraCost = parseFloat(additionalCost) || 0;
        const totalCost = wholesale + extraCost;
        let calculatedPrice = totalCost;
        const percent = parseFloat(marginPercent) || 0;
        calculatedPrice = percent >= 100 ? totalCost * 2 : totalCost / (1 - percent / 100);
        let suggestedRetailPrice = Math.round(calculatedPrice / 5) * 5;
        const finalRetailPrice = pricingMethod === 'manual' ? Math.max(0, parseFloat(manualRetailPrice) || 0) : suggestedRetailPrice;
        const profit = finalRetailPrice - totalCost;
        return {
          wholesale, extraCost, totalCost, calculatedPrice: Math.round(calculatedPrice * 100) / 100,
          suggestedRetailPrice, finalRetailPrice, profit: Math.round(profit * 100) / 100,
          actualMarginPercent: finalRetailPrice > 0 ? Math.round(((profit / finalRetailPrice) * 100) * 100) / 100 : 0,
          actualMarkupPercent: totalCost > 0 ? Math.round(((profit / totalCost) * 100) * 100) / 100 : 0
        };
      };
    }
    if (!window.syncToPhysicalFile) { window.syncToPhysicalFile = async function() {}; }
    if (!window.initDatabaseIfNeeded) { window.initDatabaseIfNeeded = async function() {}; }
    if (!window.createRevisionSnapshot) { window.createRevisionSnapshot = async function() { return { revId: 'REV-000' }; }; }
    if (!window.getRevisionHistory) { window.getRevisionHistory = async function() { return []; }; }
    if (!window.loadRevisionSnapshot) { window.loadRevisionSnapshot = async function() { return null; }; }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #printable-area,
      #printable-area * {
        visibility: visible;
      }

      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
        background: white !important;
        color: black !important;
      }

      .no-print {
        display: none !important;
      }
    }
  </style>
</head>

<body class="bg-slate-100/70 text-slate-900 antialiased min-h-screen selection:bg-emerald-600 selection:text-white">
  <div id="root"></div>

  <!-- Main Embedded Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- MAIN ADMIN APPLICATION ---
    function App() {
      const [currentPage, setCurrentPage] = useState('dashboard');
      const [products, setProducts] = useState([]);
      const [suppliers, setSuppliers] = useState([]);
      const [revisions, setRevisions] = useState([]);
      const [settings, setSettings] = useState(window.DEFAULT_APP_SETTINGS);
      const [selectedCatalog, setSelectedCatalog] = useState('ALL');
      const [loading, setLoading] = useState(true);
      const [isFileConnected, setIsFileConnected] = useState(false);

      const [editingProductId, setEditingProductId] = useState(null);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [detailModalOpen, setDetailModalOpen] = useState(false);
      const [priceTagModalOpen, setPriceTagModalOpen] = useState(false);

      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const refreshData = async () => {
        try {
          setLoading(true);
          await window.initDatabaseIfNeeded();

          let prodList = await db.products.toArray();
          let suppList = await db.suppliers.toArray();
          let revList = await window.getRevisionHistory();

          setProducts(prodList);
          setSuppliers(suppList);
          setRevisions(revList);
        } catch (err) {
          console.error('Failed to load database:', err);
        } finally {
          setLoading(false);
        }
      };

      const handleConnectDiskFile = async () => {
        const connected = await window.connectPhysicalFile();
        if (connected) {
          setIsFileConnected(true);
          await refreshData();
          showToast('Connected & synced directly with physical file data/database_file.json!');
        }
      };

      const handleExportDiskFile = async () => {
        const prods = await db.products.toArray();
        const supps = await db.suppliers.toArray();
        const revs = await db.revisions.toArray();
        const data = {
          version: 'KartarSportsDB_v4',
          exportedAt: new Date().toISOString(),
          products: prods,
          suppliers: supps,
          revisions: revs
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'database_file.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Exported physical database file (data/database_file.json)!');
      };

      const seedAllRealCatalogs = async () => {
        if (confirm('Are you sure you want to reset the database to original wholesale records? A safety snapshot commit will be created first.')) {
          try {
            await window.createRevisionSnapshot('Pre-Reset Safety Backup Snapshot');
            await db.products.clear();
            await db.suppliers.clear();

            for (const supp of window.DEFAULT_SUPPLIERS) await db.suppliers.add(supp);
            const now = new Date('2026-08-26').toISOString();
            for (const prod of window.BIG_TOYS_PRODUCTS) await db.products.add({ ...prod, createdAt: now, updatedAt: now });
            for (const prod of window.SMALL_TOYS_PRODUCTS) await db.products.add({ ...prod, createdAt: now, updatedAt: now });

            await window.createRevisionSnapshot('Reset Database to Initial 168 Wholesale Catalog Items');
            await window.syncToPhysicalFile();
            await refreshData();
            showToast('Reset database and created new version commit!');
          } catch (err) {
            console.error('Error resetting database:', err);
            showToast('Failed to reset database', 'error');
          }
        }
      };

      useEffect(() => {
        refreshData();
      }, []);

      const displayedProducts = useMemo(() => {
        if (selectedCatalog === 'ALL') return products;
        return products.filter(p => p.catalogTag === selectedCatalog);
      }, [products, selectedCatalog]);

      // Stock adjustment handler
      const handleStockAdjust = async (productId, delta) => {
        const target = products.find(p => p.id === productId);
        if (!target) return;
        const newQty = Math.max(0, (target.currentQuantity || 0) + delta);
        await db.products.update(productId, { currentQuantity: newQty, updatedAt: new Date().toISOString() });
        await window.syncToPhysicalFile();
        await refreshData();
        showToast(`Updated stock for ${target.name} to ${newQty}`);
      };

      // Mark Out of Stock handler
      const handleMarkOutOfStock = async (productId) => {
        const target = products.find(p => p.id === productId);
        if (!target) return;
        await db.products.update(productId, { currentQuantity: 0, updatedAt: new Date().toISOString() });
        await window.syncToPhysicalFile();
        await refreshData();
        showToast(`Marked ${target.name} as OUT OF STOCK!`, 'error');
      };

      // Product Delete handler
      const handleDeleteProduct = async (productId) => {
        const target = products.find(p => p.id === productId);
        if (!target) return;
        if (confirm(`Are you sure you want to delete ${target.name} (#${target.itemNo}) from database?`)) {
          await window.createRevisionSnapshot(`Before Deleting Product: ${target.name}`);
          await db.products.delete(productId);
          await window.syncToPhysicalFile();
          await refreshData();
          showToast(`Deleted ${target.name} from local database`);
        }
      };

      const handleDuplicateProduct = async (product) => {
        const { id, ...rest } = product;
        const newProd = {
          ...rest,
          name: `${product.name} (Copy)`,
          sku: `PROD${products.length + 1}`,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        await db.products.add(newProd);
        await window.syncToPhysicalFile();
        await refreshData();
        showToast(`Duplicated ${product.name}`);
      };

      const metrics = useMemo(() => {
        const totalProducts = displayedProducts.length;
        let totalWholesaleCost = 0;
        let totalRetailVal = 0;
        let lowStockCount = 0;
        let outOfStockCount = 0;

        displayedProducts.forEach(p => {
          const qty = p.currentQuantity || 0;
          totalWholesaleCost += (p.wholesalePrice + (p.additionalCost || 0)) * qty;
          totalRetailVal += p.retailPrice * qty;
          if (qty === 0) outOfStockCount++;
          else if (qty <= (p.minStockAlert || 1)) lowStockCount++;
        });

        const potentialProfit = totalRetailVal - totalWholesaleCost;
        const potentialProfitMargin = totalRetailVal > 0 ? (potentialProfit / totalRetailVal) * 100 : 0;

        return {
          totalProducts,
          totalWholesaleCost: Math.round(totalWholesaleCost * 100) / 100,
          totalRetailVal: Math.round(totalRetailVal * 100) / 100,
          potentialProfit,
          potentialProfitMargin: Math.round(potentialProfitMargin * 10) / 10,
          lowStockCount,
          outOfStockCount
        };
      }, [displayedProducts]);

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-100/70 text-slate-900 font-sans antialiased selection:bg-emerald-600 selection:text-white">

          {/* HIGH-CONTRAST MODERN SIDEBAR */}
          <aside className="w-full md:w-72 bg-white border-r-2 border-slate-200 flex flex-col shrink-0 no-print shadow-md">
            <div className="p-6 border-b-2 border-slate-100 flex items-center gap-3.5 bg-gradient-to-r from-slate-900 to-slate-800 text-white">
              <div className="w-12 h-12 rounded-2xl bg-emerald-500 flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/30">
                🏆
              </div>
              <div>
                <h1 className="font-extrabold text-base tracking-tight text-white leading-tight">
                  KARTAR SPORTS
                </h1>
                <p className="text-xs font-black text-emerald-400 uppercase tracking-wider">
                  &amp; Toys House (Admin)
                </p>
              </div>
            </div>

            {/* DIRECT LINK TO RETAIL PRICE CHECKER */}
            <div className="p-3.5 bg-slate-50 border-b-2 border-slate-200">
              <a
                href="index.html"
                className="w-full py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl text-xs flex items-center justify-center gap-2 shadow-md transition-all active:scale-95"
              >
                <span>🏷️ Customer Price Checker</span>
              </a>
            </div>

            {/* NAVIGATION LINKS */}
            <nav className="flex-1 p-3.5 space-y-1.5 overflow-y-auto">
              <div className="px-3 pt-2 pb-1 text-xs font-black text-slate-500 uppercase tracking-wider">Admin Portal</div>
              <NavItem icon="🏠" label="Dashboard" active={currentPage === 'dashboard'} onClick={() => setCurrentPage('dashboard')} />
              <NavItem icon="📦" label="Products Catalog" badge={displayedProducts.length} active={currentPage === 'products'} onClick={() => setCurrentPage('products')} />
              <NavItem icon="➕" label="Add New Product" active={currentPage === 'add_product'} onClick={() => { setEditingProductId(null); setCurrentPage('add_product'); }} />
              <NavItem icon="💰" label="Bulk Price Calculator" active={currentPage === 'price_manager'} onClick={() => setCurrentPage('price_manager')} />

              <div className="px-3 pt-4 pb-1 text-xs font-black text-slate-500 uppercase tracking-wider">Git Version &amp; Audit</div>
              <NavItem icon="📜" label="Database Control" badge={revisions.length} active={currentPage === 'revisions'} onClick={() => setCurrentPage('revisions')} />

              <div className="px-3 pt-4 pb-1 text-xs font-black text-slate-500 uppercase tracking-wider">Reports &amp; Tools</div>
              <NavItem icon="📊" label="Reports &amp; Export" active={currentPage === 'reports'} onClick={() => setCurrentPage('reports')} />
              <NavItem icon="🏪" label="Suppliers Directory" active={currentPage === 'suppliers'} onClick={() => setCurrentPage('suppliers')} />
              <NavItem icon="🖨️" label="Print Price List" active={currentPage === 'print_list'} onClick={() => setCurrentPage('print_list')} />
              <NavItem icon="⚙️" label="Settings &amp; Backup" active={currentPage === 'settings'} onClick={() => setCurrentPage('settings')} />
            </nav>

            <div className="p-4 border-t-2 border-slate-100 bg-slate-50 text-center">
              <p className="text-xs font-black text-slate-800">Kartar Sports &amp; Toys House</p>
              <p className="text-[11px] font-bold text-slate-600 mt-0.5">🛠️ Full Admin Manager Portal</p>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 overflow-y-auto p-5 md:p-8">

            {toast && (
              <div className={`fixed top-6 right-6 z-50 px-5 py-4 rounded-2xl shadow-2xl font-black text-sm border-2 flex items-center gap-3 transition-all animate-bounce ${toast.type === 'error' ? 'bg-rose-100 text-rose-900 border-rose-300' : 'bg-emerald-600 text-white border-emerald-500'
                }`}>
                <span className="text-lg">{toast.type === 'error' ? '⚠️' : '✅'}</span>
                <span>{toast.message}</span>
              </div>
            )}

            {currentPage === 'dashboard' && (
              <DashboardPage
                metrics={metrics}
                products={displayedProducts}
                revisions={revisions}
                selectedCatalog={selectedCatalog}
                setSelectedCatalog={setSelectedCatalog}
                setCurrentPage={setCurrentPage}
                setEditingProductId={setEditingProductId}
                setSelectedProduct={setSelectedProduct}
                setDetailModalOpen={setDetailModalOpen}
                handleStockAdjust={handleStockAdjust}
                handleMarkOutOfStock={handleMarkOutOfStock}
              />
            )}

            {currentPage === 'products' && (
              <ProductsPage
                products={displayedProducts}
                suppliers={suppliers}
                selectedCatalog={selectedCatalog}
                setSelectedCatalog={setSelectedCatalog}
                setCurrentPage={setCurrentPage}
                setEditingProductId={setEditingProductId}
                setSelectedProduct={setSelectedProduct}
                setDetailModalOpen={setDetailModalOpen}
                setPriceTagModalOpen={setPriceTagModalOpen}
                handleStockAdjust={handleStockAdjust}
                handleMarkOutOfStock={handleMarkOutOfStock}
                handleDeleteProduct={handleDeleteProduct}
                handleDuplicateProduct={handleDuplicateProduct}
              />
            )}

            {(currentPage === 'add_product' || currentPage === 'edit_product') && (
              <AddEditProductPage
                editingProductId={editingProductId}
                products={products}
                suppliers={suppliers}
                settings={settings}
                refreshData={refreshData}
                setCurrentPage={setCurrentPage}
                showToast={showToast}
              />
            )}

            {currentPage === 'price_manager' && (
              <PriceManagerPage
                products={displayedProducts}
                suppliers={suppliers}
                refreshData={refreshData}
                showToast={showToast}
                selectedCatalog={selectedCatalog}
                setSelectedCatalog={setSelectedCatalog}
              />
            )}

            {currentPage === 'revisions' && (
              <RevisionControlPage
                products={products}
                revisions={revisions}
                refreshData={refreshData}
                showToast={showToast}
              />
            )}

            {currentPage === 'suppliers' && (
              <SuppliersPage
                suppliers={suppliers}
                products={products}
                refreshData={refreshData}
                showToast={showToast}
              />
            )}

            {currentPage === 'reports' && (
              <ReportsPage
                products={displayedProducts}
                metrics={metrics}
                settings={settings}
              />
            )}

            {currentPage === 'print_list' && (
              <PrintPriceListPage
                products={displayedProducts}
                settings={settings}
                selectedCatalog={selectedCatalog}
              />
            )}

            {currentPage === 'settings' && (
              <SettingsPage
                settings={settings}
                db={db}
                refreshData={refreshData}
                showToast={showToast}
                seedAllRealCatalogs={seedAllRealCatalogs}
                handleConnectDiskFile={handleConnectDiskFile}
                handleExportDiskFile={handleExportDiskFile}
                isFileConnected={isFileConnected}
              />
            )}

          </main>

          {/* MODALS */}
          {detailModalOpen && selectedProduct && (
            <ProductDetailModal
              product={selectedProduct}
              supplier={suppliers.find(s => s.id === selectedProduct.supplierId)}
              onClose={() => setDetailModalOpen(false)}
              onEdit={(prod) => {
                setDetailModalOpen(false);
                setEditingProductId(prod.id);
                setCurrentPage('edit_product');
              }}
            />
          )}

          {priceTagModalOpen && selectedProduct && (
            <PriceTagModal
              product={selectedProduct}
              settings={settings}
              onClose={() => setPriceTagModalOpen(false)}
            />
          )}

        </div>
      );
    }

    function NavItem({ icon, label, badge, active, onClick }) {
      return (
        <button
          onClick={onClick}
          className={`w-full py-3 px-4 rounded-2xl font-extrabold text-xs md:text-sm flex items-center justify-between transition-all ${active
            ? 'bg-slate-950 text-white shadow-md shadow-slate-950/30'
            : 'text-slate-800 hover:bg-slate-100 hover:text-slate-950'
            }`}
        >
          <div className="flex items-center gap-3">
            <span className="text-lg">{icon}</span>
            <span>{label}</span>
          </div>
          {badge !== undefined && (
            <span className={`px-2.5 py-0.5 rounded-full text-xs font-black ${active ? 'bg-slate-800 text-emerald-400' : 'bg-slate-200 text-slate-700'}`}>
              {badge}
            </span>
          )}
        </button>
      );
    }

    // --- DASHBOARD PAGE ---
    function DashboardPage({ metrics, products, revisions, selectedCatalog, setSelectedCatalog, setCurrentPage, setEditingProductId, setSelectedProduct, setDetailModalOpen, handleStockAdjust, handleMarkOutOfStock }) {
      return (
        <div className="space-y-6">

          {/* HEADER BANNER */}
          <div className="bg-white border-2 border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
              <div className="flex items-center gap-2 mb-2">
                <span className="px-3 py-1 bg-emerald-100 text-emerald-950 rounded-full text-xs font-black uppercase tracking-wider">
                  🛠️ Admin Overview
                </span>
                <span className="text-xs text-slate-500 font-bold">• Kartar Sports &amp; Toys</span>
              </div>
              <h2 className="text-2xl md:text-3xl font-black text-slate-950 tracking-tight">Wholesale &amp; Retail Pricing Dashboard</h2>
              <p className="text-xs md:text-sm font-bold text-slate-600 mt-1">Real-time valuation of wholesale inventory and retail profit margins</p>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <button
                onClick={() => { setEditingProductId(null); setCurrentPage('add_product'); }}
                className="py-3.5 px-6 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl text-xs md:text-sm flex items-center gap-2 shadow-lg shadow-emerald-600/20 transition-all active:scale-95"
              >
                <span>➕</span> Add New Product
              </button>
              <button
                onClick={() => setCurrentPage('revisions')}
                className="py-3.5 px-5 bg-slate-950 hover:bg-slate-800 text-white font-extrabold rounded-2xl text-xs md:text-sm shadow-md flex items-center gap-2"
              >
                <span>📜</span> Version Commits ({revisions.length})
              </button>
            </div>
          </div>

          {/* METRIC STAT CARDS */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            <StatCard title="Total Products" value={metrics.totalProducts} icon="📦" subtitle="Active Catalog Items" />
            <StatCard title="Wholesale Stock Value" value={formatINR(metrics.totalWholesaleCost)} icon="💸" subtitle="Total Wholesale Cost" />
            <StatCard title="Retail Selling Value" value={formatINR(metrics.totalRetailVal)} icon="🏷️" highlight subtitle="Expected Retail Value" />
            <StatCard title="Potential Profit" value={formatINR(metrics.potentialProfit)} icon="📈" subtitle={`Est. Margin: ${metrics.potentialProfitMargin}%`} />
          </div>

          {/* QUICK INVENTORY PREVIEW */}
          <div className="bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-sm">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-black text-slate-950">Recent Catalog Inventory</h3>
              <button
                onClick={() => setCurrentPage('products')}
                className="text-xs font-black text-emerald-700 hover:text-emerald-800 uppercase tracking-wider"
              >
                View Full Catalog ({products.length}) →
              </button>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="border-b-2 border-slate-200 text-xs font-black uppercase text-slate-600 bg-slate-50">
                    <th className="py-3 px-4">S.N.</th>
                    <th className="py-3 px-4">Catalog</th>
                    <th className="py-3 px-4">Product Name</th>
                    <th className="py-3 px-4">SKU</th>
                    <th className="py-3 px-4">Wholesale</th>
                    <th className="py-3 px-4">Retail MRP</th>
                    <th className="py-3 px-4 text-center">Stock Control</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100 text-sm font-sans">
                  {products.slice(0, 10).map(p => (
                    <tr key={p.id} className="hover:bg-slate-50">
                      <td className="py-3 px-4 font-mono font-black text-slate-600">#{p.itemNo}</td>
                      <td className="py-3 px-4">

    // --- BULK PRICE MANAGER ---
    function PriceManagerPage({ products, suppliers, refreshData, showToast, selectedCatalog, setSelectedCatalog }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [modifiedPrices, setModifiedPrices] = useState({});
      const [isSaving, setIsSaving] = useState(false);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchCatalog = selectedCatalog === 'ALL' || p.catalogTag === selectedCatalog;
          const matchSearch = searchTerm === '' ||
            p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            p.sku.toLowerCase().includes(searchTerm.toLowerCase());
          return matchCatalog && matchSearch;
        });
      }, [products, selectedCatalog, searchTerm]);

      const handlePriceChange = (productId, field, rawValue) => {
        const original = products.find(p => p.id === productId);
        if (!original) return;

        const current = modifiedPrices[productId] || {
          wholesalePrice: original.wholesalePrice,
          marginPercent: original.marginPercent || 25,
          retailPrice: original.retailPrice
        };

        let newWholesale = current.wholesalePrice;
        let newMargin = current.marginPercent;
        let newRetail = current.retailPrice;

        const valNum = parseFloat(rawValue);

        if (field === 'marginPercent') {
          newMargin = rawValue === '' ? '' : (isNaN(valNum) ? 0 : valNum);
          const marginForCalc = typeof newMargin === 'number' ? newMargin : 0;
          const calc = window.calculatePrices(
            typeof newWholesale === 'number' ? newWholesale : original.wholesalePrice,
            original.additionalCost || 0,
            'margin',
            25,
            marginForCalc,
            0,
            original.roundingMethod || 'nearest5'
          );
          newRetail = calc.finalRetailPrice;
        } else if (field === 'retailPrice') {
          newRetail = rawValue === '' ? '' : (isNaN(valNum) ? 0 : valNum);
          const retailForCalc = typeof newRetail === 'number' ? newRetail : 0;
          const wholesaleForCalc = typeof newWholesale === 'number' ? newWholesale : original.wholesalePrice;
          const profit = retailForCalc - wholesaleForCalc;
          newMargin = retailForCalc > 0 ? Math.round((profit / retailForCalc) * 1000) / 10 : 0;
        } else if (field === 'wholesalePrice') {
          newWholesale = rawValue === '' ? '' : (isNaN(valNum) ? 0 : valNum);
          const wholesaleForCalc = typeof newWholesale === 'number' ? newWholesale : 0;
          const marginForCalc = typeof newMargin === 'number' ? newMargin : 25;
          const calc = window.calculatePrices(
            wholesaleForCalc,
            original.additionalCost || 0,
            'margin',
            25,
            marginForCalc,
            0,
            original.roundingMethod || 'nearest5'
          );
          newRetail = calc.finalRetailPrice;
        }

        setModifiedPrices(prev => ({
          ...prev,
          [productId]: {
            wholesalePrice: newWholesale,
            marginPercent: newMargin,
            retailPrice: newRetail
          }
        }));
      };

      const handleSaveAllPrices = async () => {
        const productIds = Object.keys(modifiedPrices);
        if (productIds.length === 0) {
          return showToast('No price changes to save', 'error');
        }

        try {
          setIsSaving(true);
          for (const idStr of productIds) {
            const id = parseInt(idStr);
            const original = products.find(p => p.id === id);
            if (!original) continue;

            const changes = modifiedPrices[idStr];
            const wholesalePrice = typeof changes.wholesalePrice === 'number' ? changes.wholesalePrice : original.wholesalePrice;
            const marginPercent = typeof changes.marginPercent === 'number' ? changes.marginPercent : (original.marginPercent || 25);
            const retailPrice = typeof changes.retailPrice === 'number' ? changes.retailPrice : original.retailPrice;

            await db.products.update(id, {
              wholesalePrice,
              marginPercent,
              retailPrice,
              updatedAt: new Date().toISOString()
            });
          }

          // Create version control snapshot commit for this price update
          await window.createRevisionSnapshot(`Bulk Price Update (${productIds.length} items modified)`);
          await window.syncToPhysicalFile();

          setModifiedPrices({});
          await refreshData();
          showToast(`Saved price updates & created version snapshot for ${productIds.length} products!`);
        } catch (err) {
          console.error('Failed bulk price update:', err);
          showToast('Failed to save bulk prices', 'error');
        } finally {
          setIsSaving(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl md:text-3xl font-black text-slate-950">Bulk Price &amp; Margin Calculator</h2>
              <p className="text-xs md:text-sm font-bold text-slate-600">Edit wholesale rates, margins, or MRPs inline with live instant calculation and save directly to physical file &amp; DB</p>
            </div>

            <button
              onClick={handleSaveAllPrices}
              disabled={Object.keys(modifiedPrices).length === 0 || isSaving}
              className={`py-3.5 px-6 font-black text-sm rounded-2xl shadow-lg flex items-center gap-2 transition-all ${Object.keys(modifiedPrices).length > 0
                ? 'bg-emerald-600 hover:bg-emerald-700 text-white cursor-pointer active:scale-95'
                : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                }`}
            >
              <span>💾</span> Save All Price Updates ({Object.keys(modifiedPrices).length})
            </button>
          </div>

          <div className="flex flex-col sm:flex-row items-center gap-3">
            <div className="relative flex-1 w-full">
              <span className="absolute inset-y-0 left-4 flex items-center text-slate-500 text-lg">🔍</span>
              <input
                type="text"
                placeholder="Search products to edit pricing..."
                value={searchTerm}
                onChange={e => setSearchTerm(e.target.value)}

                    <th className="py-4 px-4">SKU</th>
                    <th className="py-4 px-4">Wholesale Rate (₹)</th>
                    <th className="py-4 px-4">Margin %</th>
                    <th className="py-4 px-4">Retail MRP (₹)</th>

                    const changes = modifiedPrices[p.id] || {};

                    const curMargin = changes.marginPercent !== undefined ? changes.marginPercent : (p.marginPercent || 25);
                    const curRetail = changes.retailPrice !== undefined ? changes.retailPrice : p.retailPrice;

                    const numWholesale = parseFloat(curWholesale) || 0;
                    const numRetail = parseFloat(curRetail) || 0;
                    const profit = numRetail - numWholesale;
                    const isChanged = modifiedPrices[p.id] !== undefined;

    // --- GIT-LIKE VERSION CONTROL & HISTORICAL PRICE AUDIT PAGE ---
    function RevisionControlPage({ products, revisions, refreshData, showToast }) {
      const [selectedRevId, setSelectedRevId] = useState(revisions[0]?.revId || null);
      const [loadedRevision, setLoadedRevision] = useState(null);
      const [customNote, setCustomNote] = useState('');
      const [isCreatingSnapshot, setIsCreatingSnapshot] = useState(false);

      useEffect(() => {
        if (revisions.length > 0 && !selectedRevId) {
          setSelectedRevId(revisions[0].revId);
        }
      }, [revisions]);

      useEffect(() => {
        if (selectedRevId) {
          window.loadRevisionSnapshot(selectedRevId).then(rev => {
            setLoadedRevision(rev);
          });
        }
      }, [selectedRevId]);

      const handleCreateManualCommit = async (e) => {
        e.preventDefault();
        if (!customNote.trim()) return showToast('Please enter commit note', 'error');

        try {
          setIsCreatingSnapshot(true);
          const newRev = await window.createRevisionSnapshot(customNote.trim());
          setCustomNote('');
          await refreshData();
          setSelectedRevId(newRev.revId);
          showToast(`Created version commit ${newRev.revId}! Saved in data/revisions/${newRev.revId}.json`);
        } catch (err) {
          console.error(err);
          showToast('Failed to create version commit', 'error');
        } finally {
          setIsCreatingSnapshot(false);
        }
      };

      const handleRestoreRevision = async (revId, note) => {
        if (confirm(`Are you sure you want to revert database to ${revId} ("${note}")? Current items will be safely backed up before restoring.`)) {
          try {
            await window.restoreRevisionSnapshot(revId);
            await refreshData();
            showToast(`Database successfully reverted to ${revId}!`);
          } catch (err) {
            console.error(err);
            showToast('Failed to revert revision', 'error');
          }
        }
      };

      const selectedRevision = useMemo(() => {
        return loadedRevision || revisions.find(r => r.revId === selectedRevId);
      }, [loadedRevision, revisions, selectedRevId]);

      const comparisonResult = useMemo(() => {
        if (!selectedRevision || !selectedRevision.snapshotData) return null;
        return window.compareSnapshots(selectedRevision.snapshotData, products);
      }, [selectedRevision, products]);

      return (
        <div className="space-y-6">

          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="px-3 py-1 bg-slate-900 text-emerald-400 rounded-full text-xs font-mono font-black uppercase">
                  Git-like Version Control Engine
                </span>
                <span className="text-xs text-slate-500 font-bold">• Kartar Sports &amp; Toys</span>
              </div>
              <h2 className="text-2xl md:text-3xl font-black text-slate-950">Database Version History &amp; Price Comparison</h2>
              <p className="text-xs md:text-sm font-bold text-slate-600">Track price changes over time, compare business margins, and revert database state anytime</p>
            </div>
          </div>

          <form onSubmit={handleCreateManualCommit} className="bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
            <div className="flex-1">
              <label className="block text-xs font-black uppercase text-slate-500 mb-1">Create Version Commit / Price Strategy Snapshot</label>
              <input
                type="text"
                placeholder="Commit note e.g. 'Price bump for Big Toys catalog', 'Pre-Diwali wholesale rate adjustment'..."
                value={customNote}
                onChange={e => setCustomNote(e.target.value)}
                className="w-full p-3.5 bg-slate-50 border-2 border-slate-300 rounded-2xl text-sm font-extrabold text-slate-950"
              />
            </div>
            <button
              type="submit"
              disabled={isCreatingSnapshot || !customNote.trim()}
              className={`py-4 px-6 font-black text-xs rounded-2xl shadow-md whitespace-nowrap transition-all self-end sm:self-auto ${customNote.trim()
                ? 'bg-slate-950 hover:bg-slate-800 text-white cursor-pointer active:scale-95'
                : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                }`}
            >
              📸 Save Commit Snapshot
            </button>
          </form>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <div className="bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-sm space-y-4 lg:col-span-1 h-fit">
              <h3 className="font-extrabold text-base text-slate-950 flex items-center justify-between">
                <span>📜 Commit History</span>
                <span className="text-xs font-mono font-bold text-slate-500">{revisions.length} Commits</span>
              </h3>

              <div className="space-y-3 max-h-[600px] overflow-y-auto pr-1">
                {revisions.map(rev => {
                  const isSelected = rev.revId === selectedRevId;
                  const dateStr = new Date(rev.timestamp).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });

                  return (
                    <div
                      key={rev.id}
                      onClick={() => setSelectedRevId(rev.revId)}
                      className={`p-4 rounded-2xl border-2 transition-all cursor-pointer space-y-2 ${isSelected
                        ? 'bg-emerald-50/90 border-emerald-600 shadow-md ring-2 ring-emerald-600/20'
                        : 'bg-slate-50 border-slate-200 hover:bg-slate-100'
                        }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className={`px-2.5 py-0.5 rounded-lg text-xs font-mono font-black ${isSelected ? 'bg-emerald-700 text-white' : 'bg-slate-900 text-emerald-400'
                          }`}>
                          {rev.revId}
                        </span>
                        <span className="text-[11px] font-bold text-slate-500">{dateStr}</span>
                      </div>

                      <p className="font-extrabold text-xs text-slate-900 line-clamp-2">{rev.note}</p>

                      <div className="flex items-center justify-between text-[11px] font-mono font-bold text-slate-600 pt-1 border-t border-slate-200/60">
                        <span>Items: {rev.totalProducts}</span>
                        <span className="text-emerald-700 font-extrabold">{formatINR(rev.totalRetailVal)}</span>
                      </div>

                      {isSelected && (
                        <div className="pt-2 flex justify-end">
                          <button
                            onClick={(e) => { e.stopPropagation(); handleRestoreRevision(rev.revId, rev.note); }}
                            className="py-1.5 px-3 bg-rose-600 hover:bg-rose-700 text-white font-extrabold rounded-xl text-[11px] shadow transition active:scale-95"
                          >
                            ⏪ Restore This Snapshot
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-sm space-y-6 lg:col-span-2">
              {selectedRevision ? (
                <>
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b-2 border-slate-100 pb-4">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="px-2.5 py-0.5 bg-slate-900 text-emerald-400 rounded-lg text-xs font-mono font-black">
                          Comparing Current DB vs {selectedRevision.revId}
                        </span>
                      </div>
                      <h3 className="font-extrabold text-lg text-slate-950 mt-1">{selectedRevision.note}</h3>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => handleRestoreRevision(selectedRevision.revId, selectedRevision.note)}
                        className="py-2.5 px-4 bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs rounded-2xl shadow-md transition active:scale-95"
                      >
                        ⏪ Rollback DB to {selectedRevision.revId}
                      </button>
                    </div>
                  </div>

                  {comparisonResult && (
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 font-mono">
                      <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl">
                        <span className="text-xs font-sans font-extrabold uppercase text-emerald-800">📈 Price Increases</span>
                        <span className="text-2xl font-black text-emerald-950 block mt-1">{comparisonResult.summary.priceIncreases} Products</span>
                      </div>
                      <div className="p-4 bg-rose-50 border border-rose-200 rounded-2xl">
                        <span className="text-xs font-sans font-extrabold uppercase text-rose-800">📉 Price Drops</span>
                        <span className="text-2xl font-black text-rose-950 block mt-1">{comparisonResult.summary.priceDrops} Products</span>
                      </div>
                      <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl">
                        <span className="text-xs font-sans font-extrabold uppercase text-slate-600">💸 Wholesale Rate Changes</span>
                        <span className="text-2xl font-black text-slate-950 block mt-1">{comparisonResult.summary.wholesaleChanges} Products</span>
                      </div>
                    </div>
                  )}

                  {comparisonResult && (
                    <div className="border-2 border-slate-200 rounded-2xl overflow-hidden">
                      <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse text-xs">
                          <thead>
                            <tr className="bg-slate-950 text-white font-black uppercase tracking-wider">
                              <th className="py-3 px-4">SKU</th>
                              <th className="py-3 px-4">Product Name</th>
                              <th className="py-3 px-4 font-right">Past Retail MRP ({selectedRevision.revId})</th>
                              <th className="py-3 px-4 font-right">Current Retail MRP</th>
                              <th className="py-3 px-4 text-center">Price Shift</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-200 font-sans">
                            {comparisonResult.comparison.map(item => {
                              return (
                                <tr key={item.sku} className={`hover:bg-slate-50 ${item.status === 'PRICE_INCREASED' ? 'bg-emerald-50/40' : item.status === 'PRICE_DROPPED' ? 'bg-rose-50/40' : ''
                                  }`}>
                                  <td className="py-3 px-4 font-mono font-black text-slate-700">{item.sku}</td>
                                  <td className="py-3 px-4 font-extrabold text-slate-950">{item.name}</td>
                                  <td className="py-3 px-4 font-mono font-bold text-slate-600">₹{item.oldRetail}</td>
                                  <td className="py-3 px-4 font-mono font-black text-slate-950">₹{item.newRetail}</td>
                                  <td className="py-3 px-4 text-center font-mono font-black">
                                    {item.retailDelta > 0 ? (
                                      <span className="px-2.5 py-1 bg-emerald-100 text-emerald-950 border border-emerald-300 rounded-full font-extrabold">
                                        📈 +₹{item.retailDelta} (+{item.percentDelta}%)
                                      </span>
                                    ) : item.retailDelta < 0 ? (
                                      <span className="px-2.5 py-1 bg-rose-100 text-rose-950 border border-rose-300 rounded-full font-extrabold">
                                        📉 ₹{item.retailDelta} ({item.percentDelta}%)
                                      </span>
                                    ) : (
                                      <span className="text-slate-400 font-medium">Unchanged</span>
                                    )}
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </>
              ) : (
                <div className="py-16 text-center text-slate-500 font-extrabold">
                  Select a version commit from the log to view historical price comparisons
                </div>
              )}
            </div>

          </div>

        </div>
      );
    }

    // --- SUPPLIERS PAGE ---
    function SuppliersPage({ suppliers, products, refreshData, showToast }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');
      const [modalOpen, setModalOpen] = useState(false);

      const handleAddSupplier = async (e) => {
        e.preventDefault();
        if (!name.trim()) return showToast('Please enter supplier name', 'error');

        await db.suppliers.add({
          name: name.trim(),
          phone: phone.trim() || 'N/A',
          address: address.trim() || 'N/A'
        });

        setName('');
        setPhone('');
        setAddress('');
        setModalOpen(false);
        await window.syncToPhysicalFile();
        await refreshData();
        showToast('Added supplier to database!');
      };

      const handleDeleteSupplier = async (supplierId, supplierName) => {
        if (confirm(`Delete ${supplierName} from database?`)) {
          await db.suppliers.delete(supplierId);
          await window.syncToPhysicalFile();
          await refreshData();
          showToast(`Deleted ${supplierName}`);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-2xl md:text-3xl font-black text-slate-950">Suppliers Directory</h2>

              <span>➕ Add Supplier</span>
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            {suppliers.map(s => {

              return (
                <div key={s.id} className="bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-sm space-y-3 relative group">
                  <div className="flex items-start justify-between">
                    <div>
                      <h3 className="font-extrabold text-lg text-slate-950">{s.name}</h3>
                      <p className="text-xs font-bold text-emerald-700 mt-0.5">📞 {s.phone}</p>
                    </div>
                    <span className="px-3 py-1 bg-slate-100 text-slate-800 rounded-full text-xs font-black">
                      {count} Products
                    </span>
                  </div>
                  <p className="text-xs font-medium text-slate-500">{s.address}</p>

                    <button onClick={() => handleDeleteSupplier(s.id, s.name)} className="text-xs font-black text-rose-600 hover:underline">

                <h3 className="text-xl font-black text-slate-950">Add New Wholesale Supplier</h3>
                <input type="text" placeholder="Supplier / Firm Name *" value={name} onChange={e => setName(e.target.value)} required className="w-full p-3 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm font-bold" />
                <input type="text" placeholder="Phone Number" value={phone} onChange={e => setPhone(e.target.value)} className="w-full p-3 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm font-bold" />
                <textarea placeholder="Address / Location" value={address} onChange={e => setAddress(e.target.value)} className="w-full p-3 bg-slate-50 border-2 border-slate-300 rounded-xl text-sm font-bold" rows="3"></textarea>
                <div className="flex justify-end gap-2 pt-2">

            </div>

              <p className="text-xs font-bold text-slate-600">Product Wholesale &amp; Retail MRP Price Sheet</p>
            </div>

            <table className="w-full text-left text-xs border-collapse">
              <thead>
                <tr className="border-b-2 border-slate-950 font-black">
                  <th className="py-2">S.N.</th>
                  <th className="py-2">Catalog</th>
                  <th className="py-2">Item Name</th>
                  <th className="py-2">SKU</th>
                  <th className="py-2">Wholesale</th>
                  <th className="py-2">Retail MRP</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200">
                {products.map(p => (
                  <tr key={p.id} className="py-1">
                    <td className="py-2 font-mono">#{p.itemNo}</td>
                    <td className="py-2">{p.catalogTag}</td>
                    <td className="py-2 font-bold">{p.name}</td>
                    <td className="py-2 font-mono">{p.sku}</td>
                    <td className="py-2 font-mono">₹{p.wholesalePrice}</td>
                    <td className="py-2 font-mono font-bold">₹{p.retailPrice}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- SETTINGS & BACKUP PAGE ---
    function SettingsPage({ settings, db, refreshData, showToast, seedAllRealCatalogs, handleConnectDiskFile, handleExportDiskFile, isFileConnected }) {
      const fileInputRef = useRef(null);

      const handleImportBackup = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (!parsed.products || !Array.isArray(parsed.products)) {
              return showToast('Invalid physical database JSON file', 'error');
            }

            if (confirm(`Import database containing ${parsed.products.length} products into active database?`)) {
              await window.importPhysicalData(parsed);
              await refreshData();
              showToast(`Imported ${parsed.products.length} products from disk file into database!`);
            }
          } catch (err) {
            console.error(err);
            showToast('Error reading physical JSON file', 'error');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h2 className="text-2xl md:text-3xl font-black text-slate-950">Settings &amp; Database Backup</h2>
            <p className="text-xs md:text-sm font-bold text-slate-600">Export physical database files, manage disk storage, or import custom JSON backups</p>
          </div>

          {/* DATABASE DISK FILE BACKUP & EXPORT CARD */}
          <div className="bg-white border-2 border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm space-y-5">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-100">
              <div>
                <h3 className="font-black text-lg text-slate-950">💾 Database Export &amp; Backup</h3>
                <p className="text-xs font-bold text-slate-500">Master database file: <code className="bg-slate-100 px-2 py-0.5 rounded font-mono font-black text-slate-800">data/database_file.json</code></p>
              </div>
              <div className="px-3.5 py-1.5 bg-emerald-50 border border-emerald-300 rounded-full flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span className="text-xs font-mono font-black text-emerald-800">
                  {isFileConnected ? '🟢 Connected to Disk File' : '📁 Master Disk DB Active'}
                </span>
              </div>
            </div>

            <p className="text-xs font-bold text-slate-600">
              Your catalog data and revision history are saved directly to physical disk files on your computer. You can export a backup copy or connect direct file permission below.
            </p>

            <div className="flex flex-wrap items-center gap-3 pt-2">
              <button onClick={handleExportDiskFile} className="py-3.5 px-6 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs rounded-2xl shadow-md flex items-center gap-2 active:scale-95 transition-all">
                <span>💾</span> Export / Download Database Backup (.json)
              </button>

              <button onClick={handleConnectDiskFile} className="py-3.5 px-6 bg-slate-950 hover:bg-slate-800 text-white font-black text-xs rounded-2xl shadow-md flex items-center gap-2 active:scale-95 transition-all">
                <span>📂</span> Connect Direct Disk File (data/database_file.json)
              </button>

              <button onClick={() => fileInputRef.current?.click()} className="py-3.5 px-6 bg-sky-600 hover:bg-sky-700 text-white font-black text-xs rounded-2xl shadow-md flex items-center gap-2 active:scale-95 transition-all">
                <span>📤</span> Import External JSON Backup File
              </button>
              <input ref={fileInputRef} type="file" accept=".json" onChange={handleImportBackup} className="hidden" />
            </div>
          </div>

          <div className="bg-white border-2 border-rose-200 rounded-3xl p-6 md:p-8 shadow-sm space-y-4">
            <h3 className="font-extrabold text-lg text-rose-950">⚠️ Reset Database to Initial Wholesale Catalog</h3>
            <p className="text-xs font-bold text-slate-600">Re-seed all 37 Big Toys and 131 Small Toys catalog items from original wholesale estimate records.</p>
            <button onClick={seedAllRealCatalogs} className="py-3 px-6 bg-rose-600 hover:bg-rose-700 text-white font-black text-xs rounded-2xl shadow-md">
              🔄 Reset Database to Initial Catalog
            </button>
          </div>
        </div>
      );
    }

    // --- PRODUCT DETAIL MODAL ---
    function ProductDetailModal({ product, supplier, onClose, onEdit }) {
      return (
        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl border-2 border-slate-200">
            <div className="flex items-center justify-between">
              <span className="px-3 py-1 bg-slate-100 text-slate-800 text-xs font-black rounded-full">S.N. #{product.itemNo}</span>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-950 font-black">✕</button>
            </div>
            <h3 className="text-xl font-black text-slate-950">{product.name}</h3>
            <div className="grid grid-cols-2 gap-3 text-xs bg-slate-50 p-4 rounded-2xl font-mono">
              <div><span className="text-slate-500">SKU:</span> <strong>{product.sku}</strong></div>
              <div><span className="text-slate-500">Catalog:</span> <strong>{product.catalogTag}</strong></div>
              <div><span className="text-slate-500">Wholesale:</span> <strong>₹{product.wholesalePrice}</strong></div>
              <div><span className="text-slate-500">Retail MRP:</span> <strong className="text-emerald-700">₹{product.retailPrice}</strong></div>
              <div><span className="text-slate-500">Current Stock:</span> <strong>{product.currentQuantity === 0 ? 'OUT OF STOCK' : product.currentQuantity}</strong></div>
            </div>
            <div className="flex justify-end gap-2 pt-2">
              <button onClick={() => onEdit(product)} className="py-2.5 px-5 bg-emerald-600 text-white font-extrabold text-xs rounded-2xl">Edit Item</button>
              <button onClick={onClose} className="py-2.5 px-5 bg-slate-200 text-slate-800 font-extrabold text-xs rounded-2xl">Close</button>
            </div>
          </div>
        </div>
      );
    }

    // --- PRICE TAG MODAL ---
    function PriceTagModal({ product, settings, onClose }) {
      return (
        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 space-y-5 shadow-2xl border-2 border-slate-200 text-center">
            <div className="flex justify-end">
              <button onClick={onClose} className="text-slate-400 hover:text-slate-950 font-black">✕</button>
            </div>

            <div id="printable-area" className="p-6 border-4 border-slate-950 rounded-2xl bg-white space-y-3">
              <p className="text-[10px] font-black tracking-widest text-emerald-700 uppercase">{settings.shopName || 'KARTAR SPORTS AND TOYS HOUSE'}</p>
              <h3 className="font-extrabold text-xl text-slate-950">{product.name}</h3>
              <p className="text-xs font-extrabold text-slate-700 bg-slate-100 inline-block px-3 py-1 rounded-full">{product.catalogTag} • #{product.itemNo}</p>
              <div className="py-3 border-y-4 border-slate-950 bg-emerald-50 rounded-xl">
                <p className="text-[10px] uppercase font-black text-slate-700">Retail MRP</p>
                <p className="text-3xl font-black text-slate-950 mt-1">{formatINR(product.retailPrice)}</p>
              </div>
            </div>

            <button onClick={() => window.print()} className="w-full py-3.5 bg-slate-950 text-white font-black text-xs rounded-2xl shadow-md">🖨️ Print Customer Price Tag</button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
